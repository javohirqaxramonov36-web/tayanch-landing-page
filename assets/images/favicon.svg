<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161C2A"/>
      <stop offset="100%" stop-color="#080C12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E0C8"/>
      <stop offset="35%" stop-color="#A8B4B8"/>
      <stop offset="65%" stop-color="#7BA0AE"/>
      <stop offset="100%" stop-color="#3A4E5A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g fill="url(#metal)">
    <!-- top bar -->
    <rect x="92" y="122" width="328" height="78" rx="6"/>
    <!-- vertical stem -->
    <rect x="214" y="200" width="84" height="160"/>
    <!-- base serif -->
    <rect x="132" y="346" width="248" height="54" rx="6"/>
